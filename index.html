<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="MSPixelPulse is a Toronto web design and development studio helping small businesses across Canada with responsive websites, WordPress, React, e-commerce, redesigns, SEO-friendly builds, and ongoing website support."
    />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="theme-color" content="#f6f8fc" />
    <link id="site-favicon" rel="icon" href="/favicon-light.svg?v=visible-accent-border-v3" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/icon.svg?v=site-logo-outer-border-16px-v7" type="image/svg+xml" sizes="any" />
    <link rel="manifest" href="/site.webmanifest?v=site-logo-outer-border-16px-v7" />
    <link rel="canonical" href="https://mspixelpulse.com/" />
    <meta property="og:title" content="MSPixelPulse | Toronto Web Design & Development" />
    <meta
      property="og:description"
      content="Professional, responsive websites for small businesses in Toronto and across Canada. WordPress, React, e-commerce, redesigns, and ongoing website support."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mspixelpulse.com/" />
    <meta property="og:site_name" content="MSPixelPulse" />
    <meta property="og:image" content="https://mspixelpulse.com/hero/mspixelpulse-web-design-collaboration.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MSPixelPulse | Toronto Web Design & Development" />
    <meta name="twitter:description" content="Responsive websites, WordPress, React, e-commerce, redesigns, and website support for small businesses in Toronto and across Canada." />
    <meta name="twitter:image" content="https://mspixelpulse.com/hero/mspixelpulse-web-design-collaboration.webp" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://mspixelpulse.com/#organization",
            "name": "MSPixelPulse",
            "url": "https://mspixelpulse.com/",
            "logo": "https://mspixelpulse.com/icon.svg",
            "description": "Toronto web design and development studio helping small businesses across Canada with responsive websites, WordPress, React, e-commerce, redesigns, and website support.",
            "areaServed": [
              { "@type": "City", "name": "Toronto" },
              { "@type": "AdministrativeArea", "name": "Ontario" },
              { "@type": "Country", "name": "Canada" }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://mspixelpulse.com/#website",
            "url": "https://mspixelpulse.com/",
            "name": "MSPixelPulse",
            "publisher": { "@id": "https://mspixelpulse.com/#organization" },
            "inLanguage": "en-CA"
          }
        ]
      }
    </script>
    <script>
      try {
        const savedTheme = localStorage.getItem("mspixelpulse-theme");
        const initialTheme = savedTheme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", initialTheme);
        document.documentElement.style.colorScheme = initialTheme;
        document.querySelector('meta[name="theme-color"]').setAttribute(
          "content",
          initialTheme === "dark" ? "#030304" : "#f6f8fc"
        );
        document.querySelector("#site-favicon").setAttribute(
          "href",
          initialTheme === "dark"
            ? "/favicon-dark.svg?v=visible-accent-border-v3"
            : "/favicon-light.svg?v=visible-accent-border-v3"
        );
      } catch {}
    </script>
    <title>MSPixelPulse | Toronto Web Design & Development for Small Businesses</title>
  </head>
  <body class="bg-ink text-textMain antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
