<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="MSPixelPulse builds professional websites for small businesses in Toronto and across Canada, including WordPress, React, e-commerce, redesign, and maintenance work."
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#f6f8fc" />
    <link id="site-favicon" rel="icon" href="/favicon.svg?v=brand-tile-v1" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon-48x48.png?v=brand-tile-v1" type="image/png" sizes="48x48" />
    <link rel="shortcut icon" href="/favicon.ico?v=brand-tile-v1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=brand-tile-v1" sizes="180x180" />
    <link rel="mask-icon" href="/logo-monochrome.svg?v=monochrome-v1" color="#4f46e5" />
    <link rel="manifest" href="/site.webmanifest?v=brand-tile-v1" />
    <meta name="application-name" content="MSPixelPulse" />
    <meta name="apple-mobile-web-app-title" content="MSPixelPulse" />
    <meta name="msapplication-TileColor" content="#4f46e5" />
    <link rel="canonical" href="https://mspixelpulse.com/" />
    <meta property="og:title" content="MSPixelPulse" />
    <meta
      property="og:description"
      content="Professional websites built to help small businesses build trust, present their services clearly, and grow online."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mspixelpulse.com/" />
    <meta property="og:image" content="https://mspixelpulse.com/hero/mspixelpulse-web-design-collaboration.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const savedTheme = localStorage.getItem("mspixelpulse-theme");
        const initialTheme = savedTheme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", initialTheme);
        document.documentElement.style.colorScheme = initialTheme;
        document.querySelector('meta[name="theme-color"]').setAttribute(
          "content",
          initialTheme === "dark" ? "#030304" : "#f6f8fc"
        );
      } catch {}
    </script>
    <title>MSPixelPulse | Toronto Website Design</title>
  </head>
  <body class="bg-ink text-textMain antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
